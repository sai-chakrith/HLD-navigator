[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archlens"
version = "0.1.0"
description = "Reviewable AUTOSAR HLD architecture knowledge pilot"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "pydantic>=2.8", "pdfplumber>=0.11", "streamlit>=1.40", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "reportlab>=4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Long SQL/schema literals remain readable as complete statements.
[tool.ruff.lint.per-file-ignores]
"store.py" = ["E501"]
